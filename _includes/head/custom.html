{% include base_path %}

<!-- start custom head snippets -->

<!-- Page title -->
<title>{{ page.title | default: "Serena Cronin – Personal Website" }}</title>

<!-- Meta description -->
<meta name="description" content="{{ page.description | default: 'Portfolio and projects of Serena Cronin, astrophysicist and data scientist.' }}">

<!-- Ensure search engines can index -->
<meta name="robots" content="index, follow">

<!-- Canonical URL to avoid duplicate content issues -->
<link rel="canonical" href="{{ site.url }}{{ page.url }}">

<!-- Open Graph for social media sharing -->
<meta property="og:title" content="{{ page.title | default: 'Serena Cronin – Personal Website' }}">
<meta property="og:description" content="{{ page.description | default: 'Portfolio and projects of Serena Cronin, astrophysicist and data scientist.' }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/assets/og-image.png">

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
