# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale: "en-US"
site_theme: "default"  # “default” or “air” per AcademicPages theme docs :contentReference[oaicite:0]{index=0}
title: "Serena A. Cronin"
title_separator: "-"
name: &name "Serena A. Cronin"
description: &description "Ph.D. Candidate"
url: "https://serenacronin.github.io"
baseurl: ""
repository: "serenacronin.github.io"

# Site Author
author:
  avatar: "profile.jpeg"
  name: "Serena A. Cronin"
  pronouns: "she/they"
  bio: "Observational astronomer <br> who really likes galaxies."
  location: "College Park, Maryland"
  employer: "University of Maryland"
  uri: ""
  email: "cronin@umd.edu"

  academia: ""
  arxiv: ""
  googlescholar: ""
  inspire-hep: ""
  impactstory: ""
  orcid: "https://orcid.org/0000-0002-9511-1330"
  semantic: ""
  pubmed: ""
  researchgate: ""
  scopus: ""
  linkedin: "https://www.linkedin.com/in/serena-cronin-93514331a/"
  bitbucket: ""
  codepen: ""
  dribbble: ""
  github: "serenacronin"
  kaggle: ""
  stackoverflow: ""
  artstation: ""
  bluesky: ""
  facebook: ""
  flickr: ""
  foursquare: ""
  goodreads: ""
  google_plus: ""
  keybase: ""
  instagram: ""
  lastfm: ""
  mastodon: ""
  medium: ""
  pinterest: ""
  soundcloud: ""
  steam: ""
  telegram: ""
  tumblr: ""
  twitter: ""
  vine: ""
  weibo: ""
  wikipedia: ""
  xing: ""
  youtube: ""
  zhihu: ""

# Publication Categories (CV / Publications)
publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

# Site Settings
teaser: ""
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider: false
  disqus:
    shortname: ""
  discourse:
    server: ""
  facebook:
    appid: ""
    num_posts: 5
    colorscheme: "light"
  staticman:
    allowedFields: ['name', 'email', 'url', 'message']
    branch: "gh-pages"
    commitMessage: "New comment."
    filename: comment-{@timestamp}
    format: "yml"
    moderation: true
    path: "_data/comments/{options.slug}"
    requiredFields: ['name', 'email', 'message']
    transforms:
      email: "md5"
    generatedFields:
      date:
        type: "date"
        options:
          format: "iso8601"

atom_feed:
  hide: false
  path: ""

# SEO / Verification (if needed)
google_site_verification: ""
bing_site_verification: ""
alexa_site_verification: ""
yandex_site_verification: ""

# Social Sharing
twitter:
  username: ""
facebook:
  username: ""
  app_id: ""
  publisher: ""
og_image: ""
og_description: ""
social:
  type: "Person"
  name: "Serena A. Cronin"
  links: []

# Analytics
analytics:
  provider: false
  google:
    tracking_id: ""

# File Handling
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown / Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections (AcademicPages structure)
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass / SCSS
sass:
  sass_dir: _sass
  style: compressed

# Permalinks
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins — Only use ones supported by GitHub Pages / AcademicPages
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archive settings (if using AcademicPages default)
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression (if used)
compress_html:
  clippings: all
  ignore:
    envs: development
